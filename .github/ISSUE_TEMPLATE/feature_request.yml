name: Feature request
description: Propose a new variant, skill, section, or improvement.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The reader or maintainer pain, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should exist, and where should it live?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Variant template
        - Agent skill
        - Docs
        - Tooling / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing sections or tools that almost fit, and why they do not.
  - type: input
    id: example
    attributes:
      label: Real-world example (optional)
      description: A repository or README that demonstrates what you mean.
      placeholder: https://github.com/owner/repo
