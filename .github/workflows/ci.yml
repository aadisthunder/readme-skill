name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kit validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tokens, links, fences, and skill frontmatter
        run: node scripts/validate.mjs

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Unpinned on purpose for the first release. Once you have run it
      # locally, pin the version you tested (for example
      # markdownlint-cli2@0.17.2) for reproducible CI.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2
